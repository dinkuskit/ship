# Generated by `emdash-plugin release setup --trigger changesets`
# (@emdash-cms/plugin-cli 0.13.3), then adapted for this repository:
# npm instead of pnpm, Node from .nvmrc, the release Action pinned to a
# commit, a prerelease guard, and no manual workflow_dispatch: the only
# entrypoint is delegation from release.yml after the ci: release PR
# merges, so no direct dispatch can bypass the release gate. Re-apply
# these adaptations after any regeneration. See RELEASING.md.
name: "Publish EmDash plugins"

on:
  workflow_call:
    inputs:
      published-packages:
        description: "Changesets Action published-packages JSON output"
        required: true
        type: string

permissions: {}

concurrency:
  group: emdash-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Plan plugin releases"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selectors: ${{ steps.changesets.outputs.selectors }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: "Install locked dependencies"
        run: npm ci

      - name: "Plan Changesets plugin releases"
        id: changesets
        shell: bash
        env:
          EMDASH_PUBLISHED_PACKAGES: ${{ inputs.published-packages }}
        run: |
          set -euo pipefail
          node node_modules/@emdash-cms/plugin-cli/dist/index.mjs release plan --published-packages "${EMDASH_PUBLISHED_PACKAGES}" --dir .

  publish:
    name: "Build and publish ${{ matrix.selector }}"
    needs: plan
    if: ${{ needs.plan.outputs.selectors != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        selector: ${{ fromJSON(needs.plan.outputs.selectors) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for the audience-bound GitHub OIDC token.
      attestations: write # Required to sign build provenance.
    steps:
      - name: "Check repository visibility"
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::error title=Public repository required::EmDash releases currently require a public GitHub repository because private and internal repository attestations cannot yet be verified."
          exit 1

      - name: "Check out repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      # The Registry has no prerelease filter, so a beta under the real
      # slug would become the latest version for every install.
      # Prereleases route to the separate beta package; the prepare
      # helper refuses any other slug/version pairing. See "Beta
      # status" in RELEASING.md.
      - name: "Route release selector"
        id: route
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: "${{ matrix.selector }}"
        run: |
          set -euo pipefail
          slug="${EMDASH_RELEASE_SELECTOR%@*}"
          version="${EMDASH_RELEASE_SELECTOR##*@}"
          effective="${EMDASH_RELEASE_SELECTOR}"
          if [[ "$version" == *-* && "$slug" != *-beta ]]; then
            effective="${slug}-beta@${version}"
          fi
          echo "selector=${effective}" >> "${GITHUB_OUTPUT}"
          echo "Publishing selector: ${effective} (planned: ${EMDASH_RELEASE_SELECTOR})"

      - name: "Build the Ship plugin"
        run: npm run build

      - name: "Prepare plugin release"
        id: prepare
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: "${{ steps.route.outputs.selector }}"
        run: |
          set -euo pipefail
          node scripts/prepare-emdash-release.mjs "${EMDASH_RELEASE_SELECTOR}"

      - name: "Create build provenance"
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}

      # The release service currently ends successful publishes in
      # RELEASE_CONFLICT (emdash-cms/emdash#4159), so this step's
      # outcome is not the gate. The verify step below is: the job
      # only passes when the publisher PDS record for this version
      # carries exactly the bundle bytes prepared above.
      - name: "Publish plugin"
        id: publish
        continue-on-error: true
        uses: emdash-cms/emdash/apps/release-action@06f911b54f387a1284c767187042d7e11f6044fc # emdash main at generation time; bump deliberately
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          bundle-file: ${{ steps.prepare.outputs.bundle-file }}
          provenance-file: ${{ steps.attest.outputs.bundle-path }}

      - name: "Verify Registry release"
        id: verify
        shell: bash
        env:
          PUBLISHER_DID: "${{ steps.prepare.outputs.publisher-did }}"
          EMDASH_RELEASE_SELECTOR: "${{ steps.route.outputs.selector }}"
          BUNDLE_FILE: "${{ steps.prepare.outputs.bundle-file }}"
        run: |
          set -euo pipefail
          node .github/scripts/verify-registry-release.mjs \
            "${PUBLISHER_DID}" "${EMDASH_RELEASE_SELECTOR}" "${BUNDLE_FILE}"

      - name: "Note intent outcome"
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          echo "::warning title=Release intent reported failure::The delegated release intent failed (see Publish plugin step) but the Registry record was verified against the prepared bundle. Known upstream issue: emdash-cms/emdash#4159."
          {
            echo "## Registry publish verified despite intent failure"
            echo
            echo "The release intent reported failure, but the publisher PDS record for this version carries exactly the prepared bundle bytes. See emdash-cms/emdash#4159."
          } >> "${GITHUB_STEP_SUMMARY}"
