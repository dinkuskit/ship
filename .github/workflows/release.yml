# Changesets release flow, modeled on emdash-cms/emdash release.yml at
# 06f911b and adapted for one npm package publishing to the EmDash Registry.
# Merging the bot's "ci: release" PR is the publish yes: the publish job
# creates the git tag and GitHub Release, then the delegated EmDash
# workflow publishes the same version to the Registry. See RELEASING.md.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish-only:
        description: "Skip versioning, just publish the current version"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled publish can leave only part of a release behind.
  cancel-in-progress: false

# Default-deny at the workflow level. Each job scopes its own permissions.
permissions: {}

jobs:
  select:
    name: Select release mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ inputs.publish-only && 'publish' || steps.changesets.outputs.mode }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check package version stays on 0.x
        run: node .github/scripts/check-no-major.mjs
      - name: Select release mode
        if: ${{ !inputs.publish-only }}
        id: changesets
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Create release pull request
    needs: select
    if: ${{ needs.select.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create or update release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: node .github/scripts/release-version.mjs
          commit-message: "ci: release"
          pr-title: "ci: release"

  publish:
    name: Prepare release publication
    needs: select
    if: ${{ needs.select.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.recovery.outputs['published-packages'] || steps.changesets.outputs['published-packages'] }}
      registry-recovery: ${{ steps.recovery.outputs.ready }}
    permissions:
      contents: read
    steps:
      - name: Generate token
        if: ${{ !inputs.publish-only }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Registry-only recovery
        if: ${{ inputs.publish-only }}
        id: recovery
        env:
          REGISTRY_RECOVERY_REQUESTED: ${{ inputs.publish-only }}
        run: node .github/scripts/registry-recovery.mjs
      - name: Build before tagging
        run: npm run build
      # The package publishes to the EmDash Registry, not npm. Tagging is
      # the Changesets publish step: the action pushes the tag, creates the
      # GitHub Release from CHANGELOG.md, and reports published-packages
      # for the delegated Registry workflow below.
      - name: Create tag and GitHub Release
        if: ${{ !inputs.publish-only }}
        id: changesets
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: npx changeset tag

  publish-emdash-plugins:
    name: Publish to the EmDash Registry
    needs: publish
    if: needs.publish.outputs.published == 'true' || needs.publish.outputs['registry-recovery'] == 'true'
    uses: ./.github/workflows/emdash-release.yml
    with:
      published-packages: ${{ needs.publish.outputs['published-packages'] }}
    permissions:
      contents: read
      id-token: write
      attestations: write
